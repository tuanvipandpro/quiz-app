name: Validate and deploy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quiz-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      shards: ${{ steps.plan.outputs.shards }}
      frontend: ${{ steps.plan.outputs.frontend }}
      backend: ${{ steps.plan.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test tests/ciPlan.test.js tests/ciComponents.test.js
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global prettier@3.6.2
      - run: node scripts/check-docs.mjs

  frontend:
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml
    with:
      profile: ${{ needs.plan.outputs.profile }}
      shards: ${{ needs.plan.outputs.shards }}

  backend:
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml

  # Preserve the existing required-check name. Missing, failed or cancelled
  # prerequisites must fail this gate, including when a dependency was skipped.
  test-and-build:
    needs: [plan, docs, frontend, backend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci-gate.mjs
        env:
          CI_PROFILE: ${{ needs.plan.outputs.profile }}
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_FRONTEND: ${{ needs.plan.outputs.frontend }}
          CI_BACKEND: ${{ needs.plan.outputs.backend }}

  deploy-frontend:
    needs: [plan, test-and-build, deploy-backend]
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.test-and-build.result == 'success' && needs.plan.outputs.frontend == 'true'
      && (needs.plan.outputs.backend == 'false' || needs.deploy-backend.result == 'success')
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-frontend.yml

  deploy-backend:
    needs: [plan, test-and-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.plan.outputs.backend == 'true'
    uses: ./.github/workflows/deploy-backend.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
